name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file" || exit 1
          done < <(find js scripts tests data research -type f -name '*.js' \
            ! -path '*/node_modules/*' ! -path '*/vendor/*' ! -path '*/generated/*' -print0)

      - name: Run full test suite
        run: node --test tests/*.test.js

      - name: Run project-state audit
        run: node scripts/project-state-audit.js
