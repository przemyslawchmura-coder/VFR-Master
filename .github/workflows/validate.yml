name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Check JavaScript syntax
        shell: bash
        run: find js scripts tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run full test suite
        run: node --test tests/*.test.js

      - name: Run project-state audit
        run: node scripts/project-state-audit.js
